[project]
name = "temporal-pra"
version = "0.1.0"
description = "MongoDB x Temporal Partner Reference Architecture — Part 1: fresh vector store (S3 -> Kafka -> Temporal -> Voyage -> Atlas)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "temporalio>=1.9,<2",
    "pymongo[srv]>=4.9,<5",
    "voyageai>=0.3,<1",
    "aiokafka>=0.11,<1",
    "boto3>=1.35,<2",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
pdf = ["pypdf>=5,<6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "infra"]
