[project]
name = "teamporal-app"
version = "0.1.0"
description = "MongoDB x Temporal Partner Reference Architecture — Part 1: fresh vector store (S3 -> Kafka -> Temporal -> Voyage -> Atlas)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "temporalio[opentelemetry]>=1.9,<2",
    "pymongo[srv]>=4.9,<5",
    "voyageai>=0.3,<1",
    "boto3>=1.35,<2",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "pypdf>=5,<6",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "anthropic>=0.40,<1",
    "openai-agents>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "infra"]
